[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/hungchenhsu/cambium"
publish = false

[workspace.dependencies]
cambium-protocol = { path = "crates/cambium-protocol" }
cambium-backend = { path = "crates/cambium-backend" }
cambium-backend-conformance = { path = "crates/cambium-backend-conformance" }
cambium-backend-enroute = { path = "crates/cambium-backend-enroute" }
cambium-store = { path = "crates/cambium-store" }
tempfile = "3.27.0"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
ulid = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
getrandom = "0.4"
data-encoding = "2"
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protox = "0.9"
http = "1"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
sfv = "0.14"
url = "2"
gix-validate = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
