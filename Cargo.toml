[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/hungchenhsu/cambium"
publish = false

[workspace.dependencies]
cambium-protocol = { path = "crates/cambium-protocol" }
cambium-backend = { path = "crates/cambium-backend" }
cambium-backend-conformance = { path = "crates/cambium-backend-conformance" }
cambium-backend-enroute = { path = "crates/cambium-backend-enroute" }
cambium-store = { path = "crates/cambium-store" }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
