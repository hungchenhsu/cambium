name: Feature request or workload report
description: Propose a capability, or describe an agent workload that git hosting handles badly.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: Your scale, if relevant. For example repositories, branches per day, commits per day, checkouts per day, repository size, and number of concurrent agents.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
