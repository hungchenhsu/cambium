name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Report security issues privately, as described in SECURITY.md. Do not use this form for them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command or API call and its full output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, deployment model (self-hosted or hosted), storage backend, and git client version.
