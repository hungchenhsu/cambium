name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check every commit for a sign-off
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare against the current base branch, not the base SHA recorded when the PR opened,
          # so commits that reached the base branch later are not attributed to the PR.
          base="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")"
          missing=0
          for commit in $(git rev-list "$base..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $commit has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with 'git commit -s'. See CONTRIBUTING.md."
            exit 1
          fi
