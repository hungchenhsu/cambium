name: Enroute patch

on:
  pull_request:
    paths:
      - vendor/enroute/**
      - scripts/prepare_enroute.py
      - .github/workflows/enroute.yml
      - crates/cambium-backend-enroute/**
      - crates/cambium-backend/**
      - crates/cambium-backend-conformance/**
      - crates/cambium-protocol/**
      - crates/cambium-server/**
      - crates/cambium-store/**
      - Cargo.toml
      - Cargo.lock
  push:
    branches: [main]
    paths:
      - vendor/enroute/**
      - scripts/prepare_enroute.py
      - .github/workflows/enroute.yml
      - crates/cambium-backend-enroute/**
      - crates/cambium-backend/**
      - crates/cambium-backend-conformance/**
      - crates/cambium-protocol/**
      - crates/cambium-server/**
      - crates/cambium-store/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seal:
    name: Enroute durable seal
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the pinned upstream source and patch
        run: python3 scripts/prepare_enroute.py
      - name: Install Enroute's pinned toolchain
        working-directory: target/enroute
        run: rustup show
      - name: Build the minimum supported Git version
        run: |
          git init "$RUNNER_TEMP/git-2.50.0"
          git -C "$RUNNER_TEMP/git-2.50.0" remote add origin https://github.com/git/git.git
          git -C "$RUNNER_TEMP/git-2.50.0" fetch --depth 1 origin 16bd9f20a403117f2e0d9bcda6c6e621d3763e77
          git -C "$RUNNER_TEMP/git-2.50.0" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/git-2.50.0" -j 2 NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_OPENSSL=YesPlease prefix="$RUNNER_TEMP/git-minimum" install > "$RUNNER_TEMP/git-build.log" 2>&1 || { cat "$RUNNER_TEMP/git-build.log"; exit 1; }
          "$RUNNER_TEMP/git-minimum/bin/git" --version
          echo "$RUNNER_TEMP/git-minimum/bin" >> "$GITHUB_PATH"
      - name: Install the official MCP interoperability client
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-client"
          "$RUNNER_TEMP/mcp-client/bin/python" -m pip install 'mcp==2.3.0'
      - name: Check formatting and lints
        working-directory: target/enroute
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p enroute -p enroute-ledger -p enroute-compute -p enroute-shared --all-targets -- -D warnings
      - name: Test replicated state, persistence, and real git writes
        working-directory: target/enroute
        run: |
          cargo test --locked -p enroute-ledger --lib
          cargo test --locked -p enroute-shared state::tests
          cargo test --locked -p enroute --test seal
          cargo test --locked -p enroute --test repos deleted_layer_files_are_reclaimed
          cargo build --locked --bin enroute
      - name: Test Cambium adapter against the patched backend
        env:
          ENROUTE_BIN: ${{ github.workspace }}/target/enroute/target/debug/enroute
        run: cargo test --locked -p cambium-backend-enroute --test backend -- --ignored
      - name: Test shared operations and retry boundaries
        env:
          ENROUTE_BIN: ${{ github.workspace }}/target/enroute/target/debug/enroute
        run: cargo test --locked -p cambium-server --test service -- --ignored
      - name: Test HTTP, MCP, and signed Git authorization
        env:
          ENROUTE_BIN: ${{ github.workspace }}/target/enroute/target/debug/enroute
          MCP_CLIENT_PYTHON: ${{ runner.temp }}/mcp-client/bin/python
        run: cargo test --locked -p cambium-server --test transports -- --ignored
      - name: Verify source remained pinned
        run: python3 scripts/prepare_enroute.py --verify
